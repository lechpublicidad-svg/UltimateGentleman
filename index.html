function car(el){const tr=$('.track',el),dots=$('.dots',el),pv=$('.pv',el),nx=$('.nx',el);
const cs=()=>[...tr.children],rm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches,off=c=>c.offsetLeft-tr.firstElementChild.offsetLeft;
const cur=()=>{const a=cs();if(!a.length)return 0;if(tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4)return a.length-1;let b=0,m=1e9;a.forEach((c,i)=>{const d=Math.abs(off(c)-tr.scrollLeft);if(d<m){m=d;b=i}});return b};
const go=i=>{const a=cs();if(!a.length)return;i=Math.max(0,Math.min(a.length-1,i));tr.scrollTo({left:off(a[i]),behavior:rm()?'auto':'smooth'})};
const upd=()=>{const k=cur();[...dots.children].forEach((d,i)=>{d.classList.toggle('on',i===k);d.toggleAttribute('aria-current',i===k)});pv.disabled=tr.scrollLeft<4;nx.disabled=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-4};
el._r=()=>{dots.innerHTML=cs().map((_,i)=>`<button aria-label="${i+1} / ${cs().length}"></button>`).join('');tr.scrollLeft=0;upd()};
dots.onclick=e=>{const b=e.target.closest('button');if(b)go([...dots.children].indexOf(b))};pv.onclick=()=>go(cur()-1);nx.onclick=()=>go(cur()+1);
tr.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
tr.onkeydown=e=>{if(e.target!==tr)return;if(e.key==='ArrowRight'){e.preventDefault();go(cur()+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(cur()-1)}};
let dn=0,sx=0,sl=0,mv=0;tr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button)return;dn=1;mv=0;sx=e.clientX;sl=tr.scrollLeft});
addEventListener('pointermove',e=>{if(!dn)return;const d=e.clientX-sx;if(Math.abs(d)>5){mv=1;tr.classList.add('drag')}if(mv)tr.scrollLeft=sl-d});
addEventListener('pointerup',()=>{dn=0;tr.classList.remove('drag')});tr.addEventListener('click',e=>{if(mv){e.preventDefault();e.stopPropagation();mv=0}},true);addEventListener('resize',upd);el._r()}
window.gr=()=>{clearTimeout(gr.t);gr.t=setTimeout(()=>{const c=$('#c3');c&&c._r()},150)};
function modal(h){const d=$('#dlg');d.innerHTML=`<div class="dc"><button class="x" aria-label="${t(['Close','Cerrar'])}">×</button>${h}</div>`;if(!d.open)d.showModal();$('.dc .x',d).focus()}
function lb(i){const im=$$('#c3 .gc img');if(!im.length)return;i=(i+im.length)%im.length;const m=im[i];modal(`<img class="lb" src="${m.src}" alt="${esc(m.alt)}"><p>${esc(m.alt)}</p><div class="ln"><button class="btn ghost" data-n="${i-1}" aria-label="${t(['Previous','Anterior'])}">‹</button><button class="btn ghost" data-n="${i+1}" aria-label="${t(['Next','Siguiente'])}">›</button></div>`)}
/* formulario de reserva (8 pasos) */
const S={veh:'',make:'',model:'',year:'',svc:[],note:'',cond:'',zip:'',loc:'',date:'',time:'',name:'',phone:'',email:''};let st=0,done=0,bub=0;
const STEPS=[['Vehicle type','Tipo de vehículo'],['Make, model and year','Marca, modelo y año'],['Service you want','Servicio deseado'],['Vehicle condition','Estado del vehículo'],['ZIP code and address','Código postal y dirección'],['Preferred date and time','Fecha y hora preferidas'],['Your contact details','Tus datos de contacto'],['Review and send','Revisar y enviar']];
const VEH=[['Sedan','Sedán'],['SUV','SUV'],['Pickup','Pickup'],['Fleet','Flota'],['Other','Otro']],COND=[['Lightly dirty','Poco sucio'],['Moderately dirty','Moderadamente sucio'],['Heavily soiled','Muy sucio'],['Stains, pet hair or odors','Manchas, pelo de mascota u olores']],TM=[['Morning','Mañana'],['Afternoon','Tarde'],['Evening','Noche']];
const SO=PK.map(p=>[p[0],p[0]]).concat([['Paint correction','Corrección de pintura'],['Ceramic coating','Recubrimiento cerámico'],['Maintenance plan','Plan de mantenimiento']]);
const rad=(n,o,c)=>`<div class="chips" role="radiogroup">${o.map((x,i)=>`<label class="chip"><input type="radio" name="${n}" value="${i}" ${c===String(i)?'checked':''}><span>${t(x)}</span></label>`).join('')}</div>`;
const inp=(n,l,ty,ex='')=>`<label class="f">${t(l)}<input class="i" name="${n}" type="${ty}" value="${esc(S[n])}" ${ex}></label>`;
const today=()=>new Date().toISOString().slice(0,10);
const svl=()=>S.svc.map(i=>t(SO[i])).concat(S.note?[S.note]:[]).join(', ');
function wa(){return ['🚘 *'+t(['NEW BOOKING REQUEST','NUEVA SOLICITUD DE RESERVA'])+'*','━━━━━━━━━━','👤 *'+t(['Name','Nombre'])+':* '+S.name,'📞 *'+t(['Phone','Teléfono'])+':* '+S.phone,'✉️ *Email:* '+S.email,'','🚗 *'+t(['Vehicle','Vehículo'])+':* '+(S.veh===''?'':t(VEH[S.veh]))+' · '+[S.year,S.make,S.model].filter(Boolean).join(' '),'🧼 *'+t(['Service','Servicio'])+':* '+svl(),'📋 *'+t(['Condition','Estado'])+':* '+(S.cond===''?'':t(COND[S.cond])),'','📍 *ZIP:* '+S.zip+(S.loc?' · '+S.loc:''),'📅 *'+t(['Preferred date','Fecha preferida'])+':* '+S.date+' '+(S.time===''?'':t(TM[S.time])),'━━━━━━━━━━','⚠️ '+t(['Request only, not a confirmed appointment','Solo solicitud, no es una cita confirmada'])].join('\n')}
function lines(){return [[0,['Vehicle type','Tipo de vehículo'],S.veh===''?'':t(VEH[S.veh])],[1,['Vehicle','Vehículo'],[S.year,S.make,S.model].filter(Boolean).join(' ')],[2,['Service','Servicio'],svl()],[3,['Condition','Estado'],S.cond===''?'':t(COND[S.cond])],[4,['Location','Ubicación'],S.zip+(S.loc?' · '+S.loc:'')],[5,['Date and time','Fecha y hora'],S.date+' '+(S.time===''?'':t(TM[S.time]))],[6,['Contact','Contacto'],[S.name,S.phone,S.email].join(' · ')]]}
function valid(){const m=(a,b)=>t([a,b]),y=+S.year;
if(st===0&&S.veh==='')return m('Choose a vehicle type.','Elige un tipo de vehículo.');
if(st===1){if(S.make.trim().length<2||S.model.trim().length<1)return m('Enter the make and model.','Introduce marca y modelo.');if(!(y>=1950&&y<=new Date().getFullYear()+1))return m('Enter a valid year.','Introduce un año válido.')}
if(st===2&&!S.svc.length&&!S.note.trim())return m('Select a service or describe what you need.','Selecciona un servicio o describe lo que necesitas.');
if(st===3&&S.cond==='')return m('Choose the vehicle condition.','Elige el estado del vehículo.');
if(st===4&&!/^\d{5}$/.test(S.zip.trim()))return m('Enter a valid 5-digit ZIP code.','Introduce un código postal de 5 dígitos.');
if(st===5){if(!S.date||S.date<today())return m('Pick a date from today onward.','Elige una fecha desde hoy.');if(S.time==='')return m('Choose a time window.','Elige una franja horaria.')}
if(st===6){if(S.name.trim().length<2)return m('Enter your name.','Introduce tu nombre.');if(S.phone.replace(/\D/g,'').length<7)return m('Enter a valid phone number.','Introduce un teléfono válido.');if(!/^\S+@\S+\.\S+$/.test(S.email))return m('Enter a valid email.','Introduce un correo válido.')}return''}
function fr(){const f=$('#fm');
if(done){f.innerHTML=`<div class="stp"><h3 tabindex="-1" id="fh">${t(['Your request is ready','Tu solicitud está lista'])}</h3><p style="margin:10px 0;color:var(--mut)">${t(['Tap Send on WhatsApp to deliver it. This is a request, not a confirmed appointment.','Pulsa Enviar por WhatsApp para entregarla. Es una solicitud, no una cita confirmada.'])}</p><pre style="white-space:pre-wrap;background:#08122a;border-radius:12px;padding:14px;font:15px/1.5 Barlow,system-ui,sans-serif">${esc(wa())}</pre><div class="nv"><button class="btn ghost" data-act="edit">${t(['Edit','Editar'])}</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(wa())}">${t(['Send on WhatsApp','Enviar por WhatsApp'])}</a></div></div>`;return}
let b='';
if(st===0)b=rad('veh',VEH,S.veh);
if(st===1)b=inp('make',['Make','Marca'],'text')+inp('model',['Model','Modelo'],'text')+inp('year',['Year','Año'],'text','inputmode="numeric" maxlength="4"');
if(st===2)b=`<div class="chips" role="group">${SO.map((x,i)=>`<label class="chip"><input type="checkbox" name="svc" value="${i}" ${S.svc.includes(i)?'checked':''}><span>${t(x)}</span></label>`).join('')}</div>`+inp('note',['Anything specific? (optional)','¿Algo específico? (opcional)'],'text');
if(st===3)b=rad('cond',COND,S.cond);
if(st===4)b=inp('zip',['ZIP code','Código postal'],'text','autocomplete="postal-code" inputmode="numeric" maxlength="5"')+inp('loc',['Address or area (optional)','Dirección o zona (opcional)'],'text','autocomplete="street-address"');
if(st===5)b=inp('date',['Preferred date','Fecha preferida'],'date',`min="${today()}"`)+rad('time',TM,S.time)+`<p style="color:var(--mut);font-size:15px;margin-top:10px">${t(['Preferences only. We confirm real availability after reviewing your request.','Solo preferencias. Confirmamos la disponibilidad real al revisar tu solicitud.'])}</p>`;
if(st===6)b=inp('name',['Name','Nombre'],'text','autocomplete="name"')+inp('phone',['Phone','Teléfono'],'tel','autocomplete="tel"')+inp('email',['Email','Correo'],'email','autocomplete="email"');
if(st===7)b=`<div class="rv2">${lines().map(l=>`<div><div><span>${t(l[1])}</span><b>${esc(l[2])}</b></div><button data-e="${l[0]}">${t(['Edit','Editar'])}</button></div>`).join('')}</div>`;
f.innerHTML=`<div class="stp"><p style="color:var(--mut)">${t(['Step','Paso'])} ${st+1} / 8</p><div class="pg" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="${st+1}"><i style="width:${(st+1)*12.5}%"></i></div><h3 tabindex="-1" id="fh" style="font-size:22px">${t(STEPS[st])}</h3>${b}<div class="er" role="alert" id="er"></div><div class="nv"><button class="btn ghost" data-act="back" ${st?'':'disabled'}>${t(['Back','Atrás'])}</button><button class="btn" data-act="next">${st===7?t(['Prepare request','Preparar solicitud']):t(['Next','Siguiente'])}</button></div></div>`}
function stepTo(n){st=n;fr();const h=$('#fh');h&&h.focus({preventScroll:true});$('#book').scrollIntoView()}
function book(name){done=0;if(name){const i=SO.findIndex(x=>x[0]===name);if(i>=0){if(!S.svc.includes(i))S.svc.push(i)}else S.note=name}st=0;fr();$('#book').scrollIntoView()}
function init(){fr();
$('.lg').onclick=()=>{L=1-L;document.documentElement.lang=L?'es':'en';render()};
const nv=$('#nv'),mb=$('.mb');mb.onclick=()=>{const o=nv.classList.toggle('open');mb.setAttribute('aria-expanded',o)};nv.onclick=e=>{if(e.target.closest('a')){nv.classList.remove('open');mb.setAttribute('aria-expanded',false)}};
const acc=r=>$$('.ab',r).forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);$('#'+b.getAttribute('aria-controls')).classList.toggle('open',o)});acc(document);
$$('.car').forEach(car);
const setCat=i=>{CAT=i;$('#st').innerHTML=tabsH(CATS,CAT,'c');$('#c1 .track').innerHTML=svcCards();$('#c1')._r()};
$('#st').onclick=e=>{const b=e.target.closest('[data-c]');if(b)setCat(+b.dataset.c)};
$('#gt').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;GCAT=+b.dataset.g;$('#gt').innerHTML=tabsH(GC,GCAT,'g');$('#c3 .track').innerHTML=galCards();$('#c3')._r()};
const setPk=i=>{PKI=i;$$('[data-p]').forEach(x=>x.setAttribute('aria-selected',+x.dataset.p===i));$('#pkw').innerHTML=pkHTML(i);acc($('#pkw'))};
$('#packages .tabs').onclick=e=>{const b=e.target.closest('[data-p]');if(b)setPk(+b.dataset.p)};
$$('[data-nd]').forEach(a=>a.onclick=()=>{const v=a.dataset.nd;if(v==='pk')setPk(3);else setCat(+v)});
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.bk)book(b.dataset.bk);
if(b.dataset.sv!=null){const s=SV[+b.dataset.sv];modal(`<h3>${t(s[1])}</h3>${s[3]===1?`<span class="bdg" style="justify-self:start">${t(['Available on request','Disponible bajo solicitud'])}</span>`:''}<p>${t(s[2])} ${t(['Scope and price depend on vehicle size and condition. Request a quote for exact details.','El alcance y el precio dependen del tamaño y estado del vehículo. Solicita una cotización para el detalle exacto.'])}</p><div class="cta"><button class="btn" data-bk2="${esc(s[1][0])}">${t(['Book This Service','Reservar este servicio'])}</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(t(['Hi! I am interested in: ','¡Hola! Me interesa: '])+t(s[1]))}">WhatsApp</a></div>`)}
if(b.hasAttribute('data-lb'))lb($$('#c3 .gc button').indexOf(b))};
$('#dlg').onclick=e=>{const d=e.currentTarget,b=e.target.closest('button');if(e.target===d||(b&&b.classList.contains('x')))return d.close();if(b&&b.dataset.n)lb(+b.dataset.n);if(b&&b.dataset.bk2){d.close();book(b.dataset.bk2)}};
$('#dlg').onkeydown=e=>{const n=$('#dlg [data-n]');if(!n)return;const k=$$('#dlg [data-n]');if(e.key==='ArrowRight')lb(+k[1].dataset.n);if(e.key==='ArrowLeft')lb(+k[0].dataset.n)};
$('#fm').oninput=e=>{const n=e.target.name;if(n==='svc')S.svc=$$('[name=svc]:checked').map(x=>+x.value);else if(n in S)S[n]=e.target.value;const r=$('#er');if(r)r.textContent=''};
$('#fm').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
if(a==='back')stepTo(st-1);
if(a==='next'){const m=valid();if(m){$('#er').textContent=m;return}if(st===7){done=1;fr();$('#fh').focus()}else stepTo(st+1)}
if(b.dataset.e!=null)stepTo(+b.dataset.e);if(a==='edit'){done=0;stepTo(6)}};
$('#bf').onsubmit=e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim(),er=$('#be');
if(v('nm').length<2||v('ph').replace(/\D/g,'').length<7||!(+v('n')>=1)){er.textContent=t(['Enter your name, a valid phone and the number of vehicles.','Introduce tu nombre, un teléfono válido y el número de vehículos.']);return}er.textContent='';
const m=['🏢 *'+t(['BUSINESS PROPOSAL REQUEST','SOLICITUD DE PROPUESTA COMERCIAL'])+'*','━━━━━━━━━━','🏷️ '+v('co'),'👤 '+v('nm'),'📞 '+v('ph'),'🚗 '+t(['Vehicles','Vehículos'])+': '+v('n'),'📝 '+v('nd')].join('\n');window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank','noopener')};
const w=$('#wat');w.querySelector('button').onclick=()=>w.classList.remove('show');
if(!bub){bub=1;setTimeout(()=>{w.classList.add('show');setTimeout(()=>w.classList.remove('show'),9000)},4500)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('[data-s]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.s===e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
$$('main section[id]').forEach(s=>io.observe(s));
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}}),{threshold:.1});$$('.rv').forEach(x=>ro.observe(x))}
function render(){$('#app').innerHTML=build();init()}
$('#il').src=LOGO;$('#intro').style.setProperty('--lg','url('+LOGO+')');const end=()=>{const i=$('#intro');i&&i.remove();try{sessionStorage.ug=1}catch(e){}};$('#sk').onclick=end;setTimeout(end,3200);
render();
