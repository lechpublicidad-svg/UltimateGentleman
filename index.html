<div class="box rv" id="hb" style="max-width:760px"><h4>${t(['What do you want?','¿Qué quieres?'])}</h4>${rad('hn',NEED,'',x=>x)}<h4>${t(['How is the vehicle?','¿Cómo está el vehículo?'])}</h4>${rad('hc',[COND[0],COND[2]],'')}<div id="hr" aria-live="polite"></div></div></div></section>
<section class="sec alt" id="services"><div class="wrap"><div class="hd rv"><h2>${t(['Our services','Nuestros servicios'])}</h2><p>${t(['Everything your vehicle needs, at your door.','Todo lo que tu vehículo necesita, en tu puerta.'])}</p></div><div class="mos">${SV.map(tile).join('')}</div></div></section>
<section class="sec" id="packages"><div class="wrap"><div class="hd rv"><h2>${t(['Packages','Paquetes'])}</h2><p>${t(['Tap a package to see what is included. Price is by quote.','Toca un paquete para ver qué incluye. El precio es por cotización.'])}</p></div>
<div class="tabs rv" role="tablist">${PK.map((p,i)=>`<button role="tab" data-p="${i}" aria-selected="${i===3}">${p[0]}</button>`).join('')}</div><div id="pkw">${pkHTML(3)}</div></div></section>
<section class="sec alt" id="how"><div class="wrap"><div class="hd rv"><h2>${t(['How it works','Cómo funciona'])}</h2></div><div class="steps">
<div class="rv"><b>1</b><h3>${t(['Request a quote','Pide tu cotización'])}</h3><p>${t(['Tell us your vehicle and what you need. It takes a minute.','Cuéntanos tu vehículo y lo que necesitas. Toma un minuto.'])}</p></div>
<div class="rv"><b>2</b><h3>${t(['We confirm','Confirmamos'])}</h3><p>${t(['We reply with the price and a time that works.','Respondemos con el precio y un horario que funcione.'])}</p></div>
<div class="rv"><b>3</b><h3>${t(['We come to you','Vamos a ti'])}</h3><p>${t(['We detail your vehicle at your location.','Hacemos el detailing de tu vehículo en tu ubicación.'])}</p></div></div></div></section>
<section class="sec" id="gallery" hidden><div class="wrap"><div class="hd rv"><h2>${t(['Services in pictures','Servicios en imágenes'])}</h2></div><div class="gg">${GAL.map(g=>`<figure class="rv"><img src="img/${g[0]}.jpg" alt="${esc(t(g[1]))}" onload="$('#gallery').hidden=false" onerror="this.closest('figure').remove()"><figcaption>${t(g[1])}</figcaption></figure>`).join('')}</div></div></section>
<section class="sec alt" id="faq"><div class="wrap"><div class="hd rv"><h2>${t(['Good to know','Antes de reservar'])}</h2></div>${FAQ.map((f,i)=>`<div class="acc rv"><h3 style="font-size:inherit"><button class="ab" aria-expanded="false" aria-controls="fq${i}">${t(f[0])}${plus}</button></h3><div class="pn" id="fq${i}" role="region"><div><p>${t(f[1])}</p></div></div></div>`).join('')}</div></section>
<section class="sec" id="quote"><div class="wrap"><div class="hd rv" style="margin:0 auto 22px;text-align:center"><h2>${q}</h2><p>${t(['Four quick steps. It goes straight to our WhatsApp. This is a request, not a confirmed appointment.','Cuatro pasos rápidos. Llega directo a nuestro WhatsApp. Es una solicitud, no una cita confirmada.'])}</p></div><div class="box" id="fm" style="max-width:760px;margin:auto"></div></div></section>
<section class="sec alt" id="contact"><div class="wrap"><div class="hd rv"><h2>${t(['Contact','Contacto'])}</h2><p>${t(['We come to you in Vineland, NJ and Cumberland County.','Vamos a ti en Vineland, NJ y Cumberland County.'])}</p></div>
<div class="cc rv"><div><h3>Felipe Chaparro</h3><p>The Ultimate Gentleman Vehicle Detailing and Cleaning Services</p><p>Vineland, NJ · Cumberland County</p><p>${PHONE}</p></div><div class="cta"><a class="btn" href="tel:${TEL}">${t(['Call','Llamar'])}</a><a class="btn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp</a><a class="btn ghost" href="${IG}" target="_blank" rel="noopener">Instagram</a></div></div></div></section></main>
<footer><div class="wrap"><img src="${LOGO}" alt="" style="aspect-ratio:0.9654"><div><p><b style="color:var(--tx)">The Ultimate Gentleman Vehicle Detailing and Cleaning Services</b></p><p>Felipe Chaparro · Vineland, NJ · Cumberland County</p><p><a href="tel:${TEL}">${PHONE}</a> · <a href="${IG}" target="_blank" rel="noopener">Instagram</a></p><p>© 2026</p></div></div></footer>
<nav class="tab" aria-label="App">${TABS.map(x=>`<a href="#${x[1]}" data-s="${x[1]}" ${x[1]==='quote'?'class="q"':''}>${ic(x[0])}<span>${t(x[2])}</span></a>`).join('')}</nav>
<div class="wat" id="wat" role="status"><a href="https://wa.me/${WA}" target="_blank" rel="noopener">${t(['Need a quote? Write to us on WhatsApp','¿Necesitas cotización? Escríbenos por WhatsApp'])}</a><button aria-label="${t(['Close','Cerrar'])}">×</button></div>
<a class="wab" href="https://wa.me/${WA}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICO.wa}"/></svg></a>`}
/* ===== Cotización 4 pasos ===== */
const S={veh:'',svc:[],cond:'',zip:'',loc:'',date:'',time:'',name:'',phone:'',email:''};let st=0,done=0,bub=0;
const STEPS=[['Your vehicle and service','Tu vehículo y servicio'],['Condition and location','Estado y ubicación'],['Preferred date and time','Fecha y hora preferidas'],['Your contact details','Tus datos de contacto']];
const VEH=[['Sedan','Sedán'],['SUV','SUV'],['Pickup','Pickup'],['Fleet','Flota'],['Other','Otro']],TM=[['Morning','Mañana'],['Afternoon','Tarde'],['Evening','Noche']];
const SO=PK.map(p=>[p[0],p[0]]).concat([['Paint correction','Corrección de pintura'],['Ceramic protection','Protección cerámica'],['Maintenance plan','Plan de mantenimiento']]);
const inp=(n,l,ty,ex='')=>`<label class="f">${t(l)}<input class="i" name="${n}" type="${ty}" value="${esc(S[n])}" ${ex}></label>`;
const today=()=>new Date().toISOString().slice(0,10);
function wa(){return ['🚘 *'+t(['NEW QUOTE REQUEST','NUEVA SOLICITUD DE COTIZACIÓN'])+'*','━━━━━━━━━━','👤 *'+t(['Name','Nombre'])+':* '+S.name,'📞 *'+t(['Phone','Teléfono'])+':* '+S.phone,'✉️ *'+t(['Email','Correo'])+':* '+S.email,'','🚗 *'+t(['Vehicle','Vehículo'])+':* '+(S.veh===''?'':t(VEH[S.veh])),'🧼 *'+t(['Services','Servicios'])+':* '+S.svc.map(i=>t(SO[i])).join(', '),'📋 *'+t(['Condition','Estado'])+':* '+(S.cond===''?'':t(COND[S.cond])),'','📍 *ZIP:* '+S.zip+(S.loc?' · '+S.loc:''),'📅 *'+t(['Preferred date','Fecha preferida'])+':* '+S.date+' '+(S.time===''?'':t(TM[S.time])),'━━━━━━━━━━','⚠️ '+t(['Request only, not a confirmed appointment','Solo solicitud, no es una cita confirmada'])].join('\n')}
function valid(){const m=(a,b)=>t([a,b]);
if(st===0){if(S.veh==='')return m('Choose a vehicle type.','Elige un tipo de vehículo.');if(!S.svc.length)return m('Select at least one service.','Selecciona al menos un servicio.')}
if(st===1){if(S.cond==='')return m('Choose the vehicle condition.','Elige el estado del vehículo.');if(!/^\d{5}$/.test(S.zip.trim()))return m('Enter a valid 5-digit ZIP code.','Introduce un código postal de 5 dígitos.')}
if(st===2){if(!S.date||S.date<today())return m('Pick a date from today onward.','Elige una fecha desde hoy.');if(S.time==='')return m('Choose a time window.','Elige una franja horaria.')}
if(st===3){if(S.name.trim().length<2)return m('Enter your name.','Introduce tu nombre.');if(S.phone.replace(/\D/g,'').length<7)return m('Enter a valid phone number.','Introduce un teléfono válido.');if(!/^\S+@\S+\.\S+$/.test(S.email))return m('Enter a valid email.','Introduce un correo válido.')}return''}
function fr(){const f=$('#fm');
if(done){f.innerHTML=`<div class="stp"><h3 tabindex="-1" id="fh">${t(['Your request is ready','Tu solicitud está lista'])}</h3><p style="margin:10px 0;color:var(--mut)">${t(['Tap Send on WhatsApp to deliver it. This is a request, not a confirmed appointment.','Pulsa Enviar por WhatsApp para entregarla. Es una solicitud, no una cita confirmada.'])}</p><pre style="white-space:pre-wrap;background:#08122a;border-radius:12px;padding:14px;font:15px/1.5 Barlow">${esc(wa())}</pre><div class="nv"><button class="btn ghost" data-act="edit">${t(['Edit','Editar'])}</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(wa())}">${t(['Send on WhatsApp','Enviar por WhatsApp'])}</a></div></div>`;return}
let b='';
if(st===0)b=`<h4>${t(['Vehicle type','Tipo de vehículo'])}</h4>${rad('veh',VEH,S.veh)}<h4>${t(['Services (one or more)','Servicios (uno o más)'])}</h4><div class="chips" role="group">${SO.map((x,i)=>`<label class="chip"><input type="checkbox" name="svc" value="${i}" ${S.svc.includes(i)?'checked':''}><span>${t(x)}</span></label>`).join('')}</div>`;
if(st===1)b=`<h4>${t(['Vehicle condition','Estado del vehículo'])}</h4>${rad('cond',COND,S.cond)}${inp('zip',['ZIP code where we come','Código postal donde vamos'],'text','autocomplete="postal-code" inputmode="numeric" maxlength="5"')}${inp('loc',['Address or area (optional)','Dirección o zona (opcional)'],'text','autocomplete="street-address"')}`;
if(st===2)b=inp('date',['Preferred date','Fecha preferida'],'date',`min="${today()}"`)+rad('time',TM,S.time)+`<p style="color:var(--mut);font-size:15px;margin-top:10px">${t(['Preferences only. We confirm real availability after reviewing your request.','Solo preferencias. Confirmamos la disponibilidad real al revisar tu solicitud.'])}</p>`;
if(st===3)b=inp('name',['Name','Nombre'],'text','autocomplete="name"')+inp('phone',['Phone','Teléfono'],'tel','autocomplete="tel"')+inp('email',['Email','Correo'],'email','autocomplete="email"');
f.innerHTML=`<div class="stp"><p style="color:var(--mut)">${t(['Step','Paso'])} ${st+1} / 4</p><div class="pg" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${st+1}"><i style="width:${(st+1)*25}%"></i></div><h3 tabindex="-1" id="fh">${t(STEPS[st])}</h3>${b}<div class="er" role="alert" id="er"></div><div class="nv"><button class="btn ghost" data-act="back" ${st?'':'disabled'}>${t(['Back','Atrás'])}</button><button class="btn" data-act="next">${st===3?t(['Review request','Revisar solicitud']):t(['Next','Siguiente'])}</button></div></div>`}
function stepTo(n){st=n;fr();const h=$('#fh');h&&h.focus({preventScroll:true});$('#quote').scrollIntoView()}
function quote(i,c){done=0;if(i!=null&&!S.svc.includes(i))S.svc.push(i);if(c!=null)S.cond=String(c);st=0;fr();$('#quote').scrollIntoView()}
function help(){const n=$('[name=hn]:checked'),c=$('[name=hc]:checked');if(!n||!c)return;const i=NEED[+n.value][2],p=PK[i];$('#hr').innerHTML=`<div class="res"><p style="color:var(--gold);font-weight:600">${t(['We suggest','Te sugerimos'])}</p><h3>${p[0]}</h3><p style="color:var(--mut);margin:4px 0 12px">${t(p[1])}${c.value==='1'?' · '+t(['Heavy dirt may adjust the quote.','La suciedad intensa puede ajustar la cotización.']):''}</p><button class="btn" data-hq="${i}" data-hc="${c.value==='1'?2:0}">${t(['Request this quote','Cotizar este paquete'])}</button></div>`}
function init(){fr();
$('.lg').onclick=()=>{L=1-L;document.documentElement.lang=L?'es':'en';render()};
$$('.ab').forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);$('#'+b.getAttribute('aria-controls')).classList.toggle('open',o)});
$('.tabs').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;$$('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));$('#pkw').innerHTML=pkHTML(+b.dataset.p);$('[data-q]').onclick=()=>quote(+b.dataset.p)};
$('[data-q]').onclick=e=>quote(+e.currentTarget.dataset.q);
$('#hb').onchange=help;$('#hb').onclick=e=>{const b=e.target.closest('[data-hq]');if(b)quote(+b.dataset.hq,+b.dataset.hc)};
$('#fm').oninput=e=>{const n=e.target.name;if(n==='svc')S.svc=$$('[name=svc]:checked').map(x=>+x.value);else if(n in S)S[n]=e.target.value;const r=$('#er');if(r)r.textContent=''};
$('#fm').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
if(a==='back')stepTo(st-1);
if(a==='next'){const m=valid();if(m){$('#er').textContent=m;return}if(st===3){done=1;fr();$('#fh').focus()}else stepTo(st+1)}
if(a==='edit'){done=0;stepTo(3)}};
const w=$('#wat');w.querySelector('button').onclick=()=>w.classList.remove('show');
if(!bub){bub=1;setTimeout(()=>{w.classList.add('show');setTimeout(()=>w.classList.remove('show'),9000)},3000)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('[data-s]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.s===e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
TABS.forEach(x=>{const s=document.getElementById(x[1]);s&&io.observe(s)});
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');ro.unobserve(e.target)}}),{threshold:.12});$$('.rv').forEach(x=>ro.observe(x))}
function render(){$('#app').innerHTML=build();init()}
render();
</script></body></html>
